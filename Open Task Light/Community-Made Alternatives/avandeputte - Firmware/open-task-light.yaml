# ESPHome port of Open Task Light (Adafruit QT Py ESP32-S2)
#
# Pin map (QT Py ESP32-S2):
#   A1  = GPIO17 (DAC1)  -> LED driver dimming input (inverted: full scale = off)
#   RX  = GPIO16         -> IC switch control
#   A2  = GPIO9  (T9)    -> power touch pad
#   TX  = GPIO5  (T5)    -> increase touch pad
#   A3  = GPIO8  (T8)    -> decrease touch pad
#   SDA = GPIO7, SCL = GPIO6
#   NeoPixel data GPIO39, NeoPixel power GPIO38

substitutions:
  name: open-task-light
  friendly_name: Open Task Light

  # LED brightness config (BRIGHTNESS_LEVELS = 4 -> STEP 25, MIN 25, MAX 100)
  step: "25"
  min_brightness: "25"
  max_brightness: "100"
  default_power_output: "100"
  fade_ms: "250ms"

  # DAC curve. DAC_BRIGHTNESS_FLOOR 55000 / 65535 = 0.8392 ; off = 1.0 (65535)
  dac_floor: "0.8392f"
  dac_off: "1.0f"

  # Ambient light sensor config
  light_sensor_min: "1.0f"
  light_sensor_max: "12000.0f"
  ambient_sample: 1s          # original polled every loop; this is the "settle" interval

  # Temperature config
  high_temp: "50.0f"
  max_temp: "56.0f"
  temperature_scaling: "true"
  temperature_sample: 3s

  # Touch thresholds. NOT the CircuitPython values. Threshold is compared against
  # `difference` (value - benchmark) in the setup_mode log. On S2/S3 the value
  # RISES when touched, so set each threshold to roughly half the touched
  # difference (positive number), then set setup_mode: false.
  touch_power_threshold: "1000"
  touch_inc_threshold: "1000"
  touch_dec_threshold: "1000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # Runs after outputs/lights are set up (HARDWARE=800), before WiFi.
    # Sequence mirrors code.py: switch low (output default) -> DAC off
    # (light restore_mode ALWAYS_OFF) -> switch high.
    priority: 600
    then:
      # user_brightness = STEP at boot. The light is already set up (and off) at
      # this priority; this sets the brightness it will use on the next turn_on.
      - lambda: |-
          id(lamp).remote_values.set_brightness(${min_brightness} / 100.0f);
          id(lamp).current_values.set_brightness(${min_brightness} / 100.0f);
      - output.turn_on: neopixel_power
      - light.turn_on:
          id: status_pixel
          red: 0%
          green: 100%
          blue: 0%
          brightness: 30%
      - output.turn_on: ic_switch

esp32:
  board: adafruit_qtpy_esp32s2
  variant: esp32s2
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_CDC

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

i2c:
  sda: GPIO7
  scl: GPIO6
  scan: true

esp32_touch:
  setup_mode: false    # set false once thresholds are calibrated
  # S2/S3: raw value = 8 MHz ticks to complete N charge cycles. The 8 ms default
  # gives N≈64000 and saturates the 22-bit counter (value=4194303) on these pads.
  # 250us ≈ 2000 cycles (CircuitPython/IDF default is 500). Raise if values are
  # too small to discriminate, lower if they still saturate.
  measurement_duration: 250us

globals:
  - id: power_limit          # POWER_OUTPUT_LIMIT, 0..100
    type: int
    restore_value: no
    initial_value: "${default_power_output}"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
output:
  - platform: esp32_dac
    id: dac_raw
    pin: GPIO17

  # Brightness -> DAC curve from Brightness.as_driver_output():
  #   0%  -> DAC_OFF
  #   p   -> (1 - (p * limit)^2) * DAC_FLOOR
  - platform: template
    id: lamp_curve
    type: float
    write_action:
      - lambda: |-
          float level;
          if (state <= 0.0f) {
            level = ${dac_off};
          } else {
            float eff = state * id(power_limit) / 100.0f;
            level = (1.0f - eff * eff) * ${dac_floor};
          }
          id(dac_raw).set_level(level);
          ESP_LOGD("lamp", "brightness %.0f%% | limit %d%% | DAC %.4f", state * 100.0f, id(power_limit), level);

  - platform: gpio
    id: ic_switch
    pin: GPIO16          # RX. Defaults low at boot, raised in on_boot.

  - platform: gpio
    id: neopixel_power
    pin: GPIO38

# ---------------------------------------------------------------------------
# Lights
# ---------------------------------------------------------------------------
light:
  - platform: monochromatic
    id: lamp
    name: "Lamp"
    output: lamp_curve
    gamma_correct: 1.0                     # curve is handled in lamp_curve
    default_transition_length: ${fade_ms}  # replaces the 50-step manual fade
    restore_mode: ALWAYS_OFF               # _power = False at boot; brightness set in on_boot

  - platform: esp32_rmt_led_strip
    id: status_pixel
    internal: true
    pin: GPIO39
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB

# ---------------------------------------------------------------------------
# Switches
# ---------------------------------------------------------------------------
switch:
  - platform: template
    id: auto_brightness
    name: "Auto Brightness"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # Step the lamp brightness by +/- STEP, clamped to MIN/MAX, snapped to the grid.
  # The light's remote brightness is the source of truth for user_brightness.
  - id: step_brightness
    parameters:
      dir: int
    then:
      - lambda: |-
          int ub = (int) roundf(id(lamp).remote_values.get_brightness() * 100.0f);
          ub = ((ub + ${step} / 2) / ${step}) * ${step};       // snap to grid
          ub += dir * ${step};
          ub = std::max(${min_brightness}, std::min(ub, ${max_brightness}));
          auto call = id(lamp).turn_on();
          call.set_brightness(ub / 100.0f);
          call.perform();

  # Re-write the output with the current power limit (no fade).
  - id: apply_limit
    then:
      - lambda: |-
          float b = id(lamp).current_values.is_on()
                    ? id(lamp).current_values.get_brightness() : 0.0f;
          id(lamp_curve).set_level(b);

# ---------------------------------------------------------------------------
# Buttons (capacitive touch)
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: esp32_touch
    id: btn_power
    name: "Power Button"
    icon: mdi:power
    pin: GPIO9
    threshold: ${touch_power_threshold}
    filters:
      - delayed_on_off: 20ms
    on_press:
      - light.toggle: lamp

  - platform: esp32_touch
    id: btn_increase
    name: "Brightness Up Button"
    icon: mdi:brightness-7
    pin: GPIO5
    threshold: ${touch_inc_threshold}
    filters:
      - delayed_on_off: 20ms
    on_press:
      - if:
          condition:
            light.is_on: lamp
          then:
            - script.execute:
                id: step_brightness
                dir: 1

  - platform: esp32_touch
    id: btn_decrease
    name: "Brightness Down Button"
    icon: mdi:brightness-5
    pin: GPIO8
    threshold: ${touch_dec_threshold}
    filters:
      - delayed_on_off: 20ms
    on_press:
      - if:
          condition:
            light.is_on: lamp
          then:
            - script.execute:
                id: step_brightness
                dir: -1

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: veml7700
    id: light_sensor
    address: 0x10
    update_interval: ${ambient_sample}
    integration_time: 100ms
    ambient_light:
      name: "Ambient Light"
      id: ambient_lux
      on_value:
        # handle_auto_brightness()
        - if:
            condition:
              and:
                - switch.is_on: auto_brightness
                - light.is_on: lamp
            then:
              - lambda: |-
                  float lux = x;
                  float shifted = lux - ${light_sensor_min} + 1.0f;
                  float normalized = shifted / (${light_sensor_max} - ${light_sensor_min} + 1.0f);
                  float ambient = log10f(normalized * 9.0f + 1.0f) * 100.0f;
                  ambient = std::max(0.0f, std::min(ambient, 100.0f));

                  int ub = (int) roundf(id(lamp).remote_values.get_brightness() * 100.0f);
                  ESP_LOGD("lamp", "auto: user %d%% vs ambient %.1f%% at %.0f lux", ub, ambient, lux);

                  if (ambient >= ub + ${step}) {
                    id(step_brightness).execute(1);
                  } else if (ambient <= ub - ${step}) {
                    id(step_brightness).execute(-1);
                  }

  # TMP75 is register-compatible with TMP102 (0x48, MSB-aligned temp register).
  - platform: tmp102
    id: temp_sensor
    name: "Lamp Temperature"
    address: 0x48
    update_interval: ${temperature_sample}
    on_value:
      # check_temperature()
      - lambda: |-
          float temperature = x;

          // Hard cutoff: at/above MAX_TEMP the lamp turns off.
          if (temperature >= ${max_temp} && id(lamp).current_values.is_on()) {
            ESP_LOGW("lamp", "Temperature %.1fC >= MAX_TEMP. Turning off lamp.", temperature);
            id(lamp).turn_off().perform();
            return;
          }

          if (${temperature_scaling}) {
            if (temperature >= ${high_temp}) {
              int new_limit = (int)(${default_power_output} * (${max_temp} - temperature) / (${max_temp} - ${high_temp}));
              new_limit = std::max(0, std::min(new_limit, ${default_power_output}));
              if (new_limit != id(power_limit)) {
                ESP_LOGW("lamp", "Temperature %.1fC > HIGH_TEMP. Scaling power limit to %d%%", temperature, new_limit);
                id(power_limit) = new_limit;
                id(apply_limit).execute();
              }
            } else if (temperature < (${high_temp} - 2.0f)) {
              if (id(power_limit) != ${default_power_output}) {
                ESP_LOGI("lamp", "Temperature %.1fC below HIGH_TEMP. Restoring power limit to %d%%", temperature, ${default_power_output});
                id(power_limit) = ${default_power_output};
                id(apply_limit).execute();
              }
            }
          }
